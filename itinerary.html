<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Korea 2026">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">

<title>Korea 2026</title>
<style>
:root{--bg:#f4f4f7;--card:#fff;--text:#16181d;--muted:#6b7080;--line:#e3e4ea;--accent:#d6336c;--err:#a8261f;--errbg:#ffe1e1}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#1a1d24;--text:#eceef3;--muted:#9aa0ae;--line:#2a2e38;--accent:#ff6b9a;--err:#ff9d97;--errbg:#47191a}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;
  padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
p.sub{margin:0 0 20px;color:var(--muted);font-size:15px}
label.pw{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
input[type=password]:focus{border-color:var(--accent)}
.rem{display:flex;align-items:center;gap:10px;margin:14px 0 18px;font-size:15px;min-height:44px;cursor:pointer}
.rem input{width:22px;height:22px;accent-color:var(--accent)}
button{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#msg{margin:14px 0 0;font-size:15px;min-height:1.2em}
#msg.err{color:var(--err);background:var(--errbg);padding:10px 12px;border-radius:10px}
noscript{display:block;margin-top:12px;color:var(--err)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>🇰🇷 Korea 2026</h1>
  <p class="sub">Family itinerary. Enter the password to view.</p>
  <label class="pw" for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label class="rem"><input id="rem" type="checkbox" checked> Remember on this device</label>
  <button id="go" type="submit">Unlock</button>
  <div id="msg" role="status" aria-live="polite"></div>
  <noscript>JavaScript is required to view this page.</noscript>
</form>
